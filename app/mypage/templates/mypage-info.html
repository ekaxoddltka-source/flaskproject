{% extends 'base.html' %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('mypage.static', filename='css/mypage-info.css') }}">
<link rel="stylesheet" href="{{ url_for('mypage.static', filename='css/mypage.css') }}">

<style>
body::before {
    background-image: url("{{ url_for('mypage.static', filename=current_bg) }}");
}
</style>
{% endblock %}

{% block content %}
<div class="posts">

    <div id="edit-panel" class="content-panel">
        <div class="info-edit-wrapper">
            <h2>회원 정보 수정</h2>

            <form class="edit-form">

                <!-- 아이디 (읽기 전용) -->
                <label for="userid">아이디</label>
                <input type="text"
                       id="userid"
                       name="userid"
                       value="{{ user.id }}"
                       readonly>

                <!-- 비밀번호 -->
                <label for="password">비밀번호</label>
                <input type="password"
                       id="password"
                       name="password"
                       placeholder="새 비밀번호 입력">

                <label for="confirm-password">비밀번호 확인</label>
                <input type="password"
                       id="confirm-password"
                       name="confirm-password"
                       placeholder="비밀번호 확인">
                <p id="pw-message" class="pw-message"></p>

                <!-- 닉네임 -->
                <label for="nickname">닉네임</label>
                <div class="input-group">
                    <input type="text"
                           id="nickname"
                           name="nickname"
                           value="{{ user.nick }}"
                           data-original="{{ user.nick }}">
                    <button type="button" id="nickname-check-btn">중복확인</button>
                </div>

                <!-- 이메일 (인증 기능 제거) -->
                <label for="email">이메일</label>
                <div class="input-group">
                    <input type="email"
                           id="email"
                           name="email"
                           value="{{ user.email }}"
                           data-original="{{ user.email }}">
                </div>

                <!-- 이메일 인증 영역 비활성 -->
                <div id="email-auth-wrap"
                     class="email-auth-area"
                     style="display:none;"></div>

                <!-- 제출/취소 -->
                <div class="form-actions">
                    <button type="submit">수정하기</button>
                    <button type="button" id="cancel-btn">취소</button>
                </div>

            </form>
        </div>
    </div>

</div>
</div>

<script src="{{ url_for('mypage.static', filename='js/mypage-info.js') }}"></script>
{% endblock %}
