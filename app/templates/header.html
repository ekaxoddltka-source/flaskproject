<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>AEZEN 일반인 EZEN 개발자</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
</head>
<body>
  <!-------------------- 헤더영역 ---------------------->
  <!-- 로고 + 타이틀 + 로그인박스 + 아이콘 -->
  <header>
    <!-- 로고 -->
    <div class="logo">
      <a href="/">
        <img src="{{ url_for('static', filename='images/ezen_logo.jpg') }}" alt="Logo" style="width: 80px; height: 80px;">
      </a>
    </div>
    <!-- 타이틀 -->
    <div class="site-title">
      <a href="/" class="site-link">
        <img src="{{ url_for('static', filename='images/site_title.png') }}">
      </a>
    </div>
    <!-- 로그인박스 (초기 보임) -->
    {% if not session.get("user") %}
    <div class="login-box">
      <form action="{{ url_for('account.login') }}" method="POST">
        <input type="text" name="username" placeholder="ID 입력" required>
        <input type="password" name="password" placeholder="PW 입력" required>

        <div class="login-options">
          <label><input type="checkbox" id="rememberMe"> ID 기억하기</label>
          <a href="join-find">ID/PW 찾기</a>
          <a href="join-agree">회원가입</a>
        </div>

        <button type="submit">로그인</button>
      </form>
    </div>
    {% else %}
    <!-- 로그인 후 아이콘 + 환영 메시지 -->
    <div class="user-welcome">
        <img src="{{ url_for('mypage.static', filename=session.user.icon if session.user.icon else 'icons/default.png') }}" 
            alt="아이콘" class="header-user-icon">
        <span>'{{ session.user.nick }}' 님 환영합니다.</span>
    </div>

    <!-- 아이콘 (초기 숨김) -->
    <div class="icons {% if session.user.user_type == 1 %}icons-admin{% endif %}">
        <button id="btnMyPage" data-tooltip="마이페이지" data-url="{{ url_for('mypage.mypage_posts') }}">👨</button>
        <button id="btnNotify" data-tooltip="알림">🔔</button>
        <button id="btnMsg" data-tooltip="메세지">📬</button>
        <button id="btnTrophy" data-tooltip="포인트">🏆</button>
        {% if session.user.user_type == 1 %}
            <button id="btnAdminModal" data-tooltip="관리자 모드" onclick="location.href='/admin-users'">🛠️</button>
        {% endif %}
        <form action="{{ url_for('account.logout') }}" method="GET" style="display:inline;">
            <button type="submit" id="btnLogout" data-tooltip="로그아웃">🔑</button>
        </form>
    </div>
    {% endif %}
  </header>
  <!-------------------- 헤더 끝 ---------------------->

  <!-------------------- 메인영역 ---------------------->
  <main>
    <!-- 컨테이너 (게시글 래퍼 + 사이드바) -->
    <div class="container">
      <!-- 게시글 래퍼( 공지/정렬버튼 + 게시글 ) -->
      <div class="posts-wrapper">
        <!-- 공지/정렬버튼 -->
        <div class="notice-bar">

            <div class="notice-text">
            <strong>📢 공지사항&nbsp;&nbsp;: </strong>&nbsp;&nbsp;
            <a href="info" id="latestNotice" class="notice-note" style="color: rgb(219, 219, 93);">이용규칙 안내 .......</a>
            </div>

            <!-- 조건부 렌더링 영역 -->
            {% if show_notice_buttons %}
            <div class="notice-buttons">

                <!-- 🔽 정렬 셀렉트박스 -->
                <div class="top-select">
                    <select id="topSelect">
                        {% for btn in notice_buttons.top_buttons %}
                            {% if btn != "검색" %}
                            <option value="{{ btn }}"
                                {% if request.args.get('top','최신순') == btn %}selected{% endif %}>
                                {{ btn }}
                            </option>
                            {% endif %}
                        {% endfor %}
                    </select>

                    <!-- 검색 버튼은 그대로 -->
                    <button id="btnSearchToggle">검색</button>

                    <!-- 기존 검색 박스 유지 -->
                    <div id="inlineSearchBox" style="display:none; margin-top:6px;">
                        <select id="inlineSearchType">
                            <option value="board_title">제목</option>
                            <option value="board_content">내용</option>
                            <option value="id">작성자</option>
                            <option value="tag">해시태그</option>
                        </select>
                        <input type="text" id="inlineSearchInput" placeholder="검색어 입력">
                        <button id="inlineSearchSubmit">검색</button>
                        <button id="inlineSearchClose">닫기</button>
                    </div>
                </div>

                <!-- 🔽 피드 셀렉트박스 -->
                <div class="feed-select">
                    <select id="feedSelect">
                        {% for btn in notice_buttons.feed_buttons %}
                        <option value="{{ btn }}"
                            {% if request.args.get('feed','전체') == btn %}selected{% endif %}>
                            {{ btn }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

            </div>
            {% endif %}
        </div>
