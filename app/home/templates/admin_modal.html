<div id="adminModalContent" class="modal-content">
    <span id="closeModal" class="close">&times;</span>
    <h2>관리자 모드</h2>

    <!-- 탭 메뉴 -->
    <div class="admin-tabs">
        <button class="tab-btn active" data-target="tab-users">사용자 관리</button>
        <button class="tab-btn" data-target="tab-reports">신고 관리</button>
        <button class="tab-btn" data-target="tab-ads">광고 관리</button>
    </div>

    <!-- 탭 콘텐츠 영역 -->
    <div class="tab-content">


        <div id="tab-users" class="tab-panel">

            <!-- 검색 + 정렬 영역 -->
            <div class="user-search-sort">

                <!-- 검색 -->
                <div class="user-search">
                    <input type="text" id="searchUserInput" placeholder="ID 또는 닉네임으로 검색" />
                    <button id="searchUserBtn">검색</button>
                </div>

                <!-- 정렬 -->
                <div class="user-sort">
                    <select id="sortUserSelect">
                        <option value="">정렬 기준 선택</option>
                        <option value="created_at">가입일</option>
                        <option value="last_login_at">마지막 로그인</option>
                        <option value="user_type">유저 타입</option>
                        <option value="withdraw">탈퇴 여부</option>
                    </select>
                    <!-- 오름차순 / 내림차순 토글 (초기값 ASC) -->
                    <button id="sortOrderBtn" data-order="asc">오름차순</button>

                    <button id="sortUserBtn">정렬</button>
                </div>

            </div>

            <!-- 사용자 관리 테이블 -->
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>이름</th>
                        <th>닉네임</th>
                        <th>이메일</th>
                        <th>가입일</th>
                        <th>수정일</th>
                        <th>마지막 로그인</th>
                        <th>유저 타입</th>
                        <th>탈퇴 여부</th>
                        <th>탈퇴일자</th>
                        <th>보유 포인트</th>
                        <th>관리</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <!-- JS로 동적 로딩 -->
                </tbody>
            </table>

        </div>





        <div id="tab-reports" class="tab-panel hidden">
            <!-- 신고 관리 내용 -->
        </div>




        <div id="tab-ads" class="tab-panel hidden">
            <!-- 광고 관리 내용 -->
        </div>



    </div>
</div>
